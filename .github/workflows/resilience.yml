name: Resilience

on:
  workflow_dispatch:

concurrency:
  group: resilience-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resilience:
    name: Serialized infrastructure resilience
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start test infrastructure
        run: |
          cp .env.example .env
          docker compose up -d
          npm run infra:wait
      - name: Run Order, Inventory, and Payment resilience serially
        run: npm run test:resilience
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-failure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 10
      - name: Infrastructure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop test infrastructure
        if: always()
        run: docker compose down
