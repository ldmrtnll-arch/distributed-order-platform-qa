name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  test:
    name: API and database tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start test infrastructure
        run: |
          cp .env.example .env
          docker compose up -d
          npm run infra:wait
      - name: Run normal Playwright suite
        run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normal-playwright-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 10
      - name: Infrastructure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop test infrastructure
        if: always()
        run: docker compose down

  events:
    name: Event and Notification tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start test infrastructure
        run: |
          cp .env.example .env
          docker compose up -d
          npm run infra:wait
      - name: Run event Playwright suite
        run: npm run test:events
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-playwright-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 10
      - name: Infrastructure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop test infrastructure
        if: always()
        run: docker compose down

  performance-smoke:
    name: K6 smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start test infrastructure
        run: |
          cp .env.example .env
          docker compose up -d
          npm run infra:wait
      - run: npm run test:performance:smoke
      - name: Upload K6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-${{ github.run_attempt }}
          path: artifacts/performance/
          if-no-files-found: warn
          retention-days: 10
      - name: Infrastructure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop test infrastructure
        if: always()
        run: docker compose down
